<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09111e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR-Tago">
  <title>QR-Tago | درع الحماية الذكي</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='15' y1='10' x2='105' y2='110' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23F6E08B'/%3E%3Cstop offset='50%25' stop-color='%23D4AF37'/%3E%3Cstop offset='100%25' stop-color='%23997A15'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='26' fill='%2309111e'/%3E%3Cpath d='M60 16L94 29V58C94 81.5 79.2 100.8 60 108C40.8 100.8 26 81.5 26 58V29L60 16Z' fill='url(%23g)'/%3E%3Cpath d='M44 47V41H50M70 41H76V47M76 69V75H70M50 75H44V69' stroke='%2309111e' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M51 49H69V54.5H62.8V71H57.2V54.5H51V49Z' fill='%2309111e'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='15' y1='10' x2='105' y2='110' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23F6E08B'/%3E%3Cstop offset='50%25' stop-color='%23D4AF37'/%3E%3Cstop offset='100%25' stop-color='%23997A15'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='120' height='120' rx='26' fill='%2309111e'/%3E%3Cpath d='M60 16L94 29V58C94 81.5 79.2 100.8 60 108C40.8 100.8 26 81.5 26 58V29L60 16Z' fill='url(%23g)'/%3E%3Cpath d='M44 47V41H50M70 41H76V47M76 69V75H70M50 75H44V69' stroke='%2309111e' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M51 49H69V54.5H62.8V71H57.2V54.5H51V49Z' fill='%2309111e'/%3E%3C/svg%3E">
  <link id="pwa-manifest" rel="manifest" href="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #09111e;
      --card-bg: rgba(15, 25, 42, 0.94);
      --gold-light: #f6e08b;
      --gold-main: #d4af37;
      --gold-dark: #997a15;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: rgba(11, 18, 32, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #0b1424 0%, #070d17 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(212, 175, 55, 0.12) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
    }

    .main-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      border-radius: 26px;
      padding: 26px 20px 22px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(246, 224, 139, 0.25);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      margin-top: 28px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .main-card.lost-mode {
      border-color: #ef4444;
      box-shadow: 
        0 20px 50px rgba(239, 68, 68, 0.28),
        inset 0 1px 0 rgba(248, 113, 113, 0.35);
    }

    .top-controls-left {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }

    html[dir="ltr"] .top-controls-left {
      left: auto;
      right: 14px;
    }

    .top-pill-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold-light);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .top-pill-btn:hover {
      background: rgba(212, 175, 55, 0.28);
    }

    .music-btn {
      width: 30px;
      height: 26px;
      padding: 0;
      font-size: 13px;
    }

    .music-btn.playing {
      background: rgba(212, 175, 55, 0.32);
      border-color: var(--gold-light);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.35);
    }

    .install-top-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid rgba(96, 165, 250, 0.5);
      color: #93c5fd;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 5;
    }

    html[dir="ltr"] .install-top-btn {
      right: auto;
      left: 14px;
    }

    .logo-wrapper {
      margin-top: -64px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .shield-svg {
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 8px 18px rgba(212, 175, 55, 0.35));
    }

    .brand-en {
      font-family: 'Poppins', sans-serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
      margin-top: 4px;
      background: linear-gradient(180deg, #f6e08b 0%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-en span {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-ar {
      font-size: 23px;
      font-weight: 900;
      background: linear-gradient(180deg, #f6e08b 10%, #c59b27 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .badges-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .id-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(90deg, #b88d1e 0%, #f3d778 50%, #b88d1e 100%);
      color: #0b1320;
      font-weight: 800;
      font-size: 13.5px;
      padding: 5px 18px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #93c5fd;
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 50px;
    }

    .quick-lookup-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(9, 17, 30, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.32);
      border-radius: 14px;
      padding: 5px 7px;
      margin-bottom: 14px;
    }

    .quick-lookup-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 8px;
      outline: none;
      min-width: 0;
    }

    .quick-lookup-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .quick-lookup-btn {
      background: linear-gradient(135deg, #d4af37, #b88d1e);
      color: #09111e;
      border: none;
      border-radius: 10px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.2s;
    }

    .quick-lookup-btn:hover {
      filter: brightness(1.1);
    }

    .lost-alert-banner {
      background: linear-gradient(90deg, #dc2626, #991b1b);
      color: #fff;
      font-weight: 800;
      font-size: 13.5px;
      padding: 9px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.45);
      animation: pulseAlert 1.8s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(180deg, #f6e08b 0%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .section-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .input-group {
      position: relative;
      margin-bottom: 11px;
      text-align: right;
    }

    html[dir="ltr"] .input-group {
      text-align: left;
    }

    .input-field, .select-field {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 12px 16px 12px 44px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      transition: all 0.25s ease;
    }

    html[dir="ltr"] .input-field, html[dir="ltr"] .select-field {
      padding: 12px 44px 12px 16px;
    }

    .select-field option {
      background: #0f172a;
      color: #ffffff;
    }

    .input-field::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
      background: rgba(15, 25, 45, 0.98);
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--gold-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
    }

    html[dir="ltr"] .input-icon {
      left: auto;
      right: 14px;
    }

    .options-box {
      background: rgba(11, 18, 32, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      text-align: right;
    }

    html[dir="ltr"] .options-box {
      text-align: left;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: #e2e8f0;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--gold-main);
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      margin-top: 4px;
      padding: 13px 20px;
      border: 1px solid rgba(246, 224, 139, 0.6);
      border-radius: 14px;
      background: linear-gradient(90deg, #d4af37 0%, #8ea468 48%, #2563eb 100%);
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.25), 0 4px 12px rgba(212, 175, 55, 0.25);
      transition: transform 0.2s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .owner-box {
      background: rgba(10, 17, 30, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
    }

    .owner-label {
      font-size: 12px;
      color: var(--gold-light);
      margin-bottom: 2px;
    }

    .owner-name {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .emergency-note {
      background: rgba(212, 175, 55, 0.12);
      border-right: 3px solid var(--gold-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      color: #f8fafc;
      text-align: right;
      line-height: 1.55;
      margin-top: 8px;
    }

    html[dir="ltr"] .emergency-note {
      border-right: none;
      border-left: 3px solid var(--gold-main);
      text-align: left;
    }

    .sub-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 17, 30, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      padding: 8px 12px;
      margin-top: 10px;
      font-size: 11.5px;
      color: #cbd5e1;
      gap: 8px;
    }

    .sub-date-info {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .digital-counter {
      font-family: 'Poppins', 'Cairo', sans-serif;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #4ade80;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 11.5px;
      white-space: nowrap;
    }

    .digital-counter.warning {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fbbf24;
    }

    .digital-counter.expired {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .expired-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #fca5a5;
      line-height: 1.5;
    }

    .qr-share-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: center;
    }

    .qr-share-box img {
      width: 125px;
      height: 125px;
      border-radius: 10px;
      background: #fff;
      padding: 6px;
      margin: 6px auto;
      display: block;
    }

    .link-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 17, 30, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: var(--gold-light);
      direction: ltr;
      margin-top: 6px;
      gap: 6px;
    }

    .copy-mini-btn {
      background: var(--gold-main);
      color: #09111e;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 13px;
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 9px;
      transition: transform 0.15s ease, opacity 0.2s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-call {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-wa {
      background: linear-gradient(135deg, #16a34a, #15803d);
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
    }

    .btn-gps {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
    }

    .btn-vcard {
      background: rgba(212, 175, 55, 0.16);
      border: 1px solid rgba(212, 175, 55, 0.55);
      color: var(--gold-light);
    }

    .btn-renew {
      background: linear-gradient(135deg, #d4af37, #997a15);
      color: #09111e;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
    }

    .owner-footer-btns {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-edit-link {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-light);
      font-size: 12.5px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
    }

    .btn-new-tag-link {
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
      font-size: 12.5px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
    }

    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: rgba(9, 17, 30, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 12px;
      padding: 10px 6px;
    }

    .stat-num {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--gold-light);
    }

    .stat-lbl {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .admin-list {
      max-height: 330px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      text-align: right;
    }

    .admin-item {
      background: rgba(10, 17, 30, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .admin-item-info {
      font-size: 12px;
      line-height: 1.45;
    }

    .admin-item-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .mini-wa-btn {
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      text-align: center;
    }

    .mini-view-btn {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.4);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 7px;
      text-decoration: none;
      text-align: center;
    }

    .footer-text {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--gold-main);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 18px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="main-card" id="main-card">

  <style>
    :root {
      --bg-dark: #09111e;
      --card-bg: rgba(15, 25, 42, 0.94);
      --gold-light: #f6e08b;
      --gold-main: #d4af37;
      --gold-dark: #997a15;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: rgba(11, 18, 32, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
        linear-gradient(180deg, #0b1424 0%, #070d17 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(212, 175, 55, 0.12) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .main-card {
      background: var(--card-bg);
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      border-radius: 26px;
      padding: 26px 20px 22px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(246, 224, 139, 0.25);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
      margin-top: 28px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* وضع الطوارئ / المفقود */
    .main-card.lost-mode {
      border-color: #ef4444;
      box-shadow: 
        0 20px 50px rgba(239, 68, 68, 0.28),
        inset 0 1px 0 rgba(248, 113, 113, 0.35);
    }

    /* زر تبديل اللغة */
    .lang-toggle-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: var(--gold-light);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
      z-index: 5;
    }

    html[dir="ltr"] .lang-toggle-btn {
      left: auto;
      right: 14px;
    }

    .lang-toggle-btn:hover {
      background: rgba(212, 175, 55, 0.3);
    }

      margin-top: -64px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .shield-svg {
      width: 90px;
      height: 90px;
      filter: drop-shadow(0 8px 18px rgba(212, 175, 55, 0.35));
    }

      font-family: 'Poppins', sans-serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
      margin-top: 4px;
      background: linear-gradient(180deg, #f6e08b 0%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-en span {
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
    }
